# =============================================================================
# Nginx Configuration for ERP System - anbinhfoods.net
# =============================================================================
# SSL/HTTPS:
#   Nếu có SSL certificate, đặt file vào ./nginx/ssl/:
#     - cert.pem  (SSL Certificate)
#     - key.pem   (Private Key)
#   Nginx sẽ tự detect và bật HTTPS + redirect HTTP→HTTPS.
#   Nếu không có SSL, chỉ chạy HTTP trên port 80.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    types_hash_max_size 2048;

    # Buffer settings for 300 users
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 16k;
    client_body_buffer_size 128k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/xml+rss image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:20m rate=10r/m;

    # Upstream definitions
    upstream backend_api {
        server backend:5000;
        keepalive 64;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 64;
    }

    # HTTP Server — hoạt động luôn (có hoặc không có SSL)
    server {
        listen 80;
        server_name anbinhfoods.net www.anbinhfoods.net;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # File upload size
        client_max_body_size 50M;

        # API Backend
        location /api {
            limit_req zone=api burst=60 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Login endpoint with stricter rate limiting
        location /api/auth/login {
            limit_req zone=login burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads folder
        location /uploads {
            proxy_pass http://backend_api/uploads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1d;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend_api/health;
        }

        # Frontend React App (default)
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ==========================================================================
    # HTTPS Server — BẬT KHI CÓ SSL CERTIFICATE
    # Bỏ comment block bên dưới sau khi đặt cert.pem + key.pem vào nginx/ssl/
    # Đồng thời thêm "return 301 https://$host$request_uri;" vào HTTP server
    # block ở trên (thay thế các location blocks) để redirect HTTP → HTTPS.
