worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker DNS resolver for dynamic upstream resolution (valid=30s)
    # Dùng biến + proxy_pass để resolve động, tránh cache IP cũ sau khi recreate container
    # (upstream block chỉ resolve 1 lần lúc start → 502 khi backend/frontend đổi IP)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ================= HTTP → HTTPS =================
    server {
        listen 80;
        server_name anbinhfoods.net www.anbinhfoods.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================= HTTPS SERVER =================
    server {
        listen 443 ssl;
        http2 on;
        server_name anbinhfoods.net www.anbinhfoods.net;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location /api {
            set $backend http://erp_backend:5000;
            proxy_pass $backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location /uploads {
            set $backend http://erp_backend:5000;
            proxy_pass $backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /portainer/ {
            set $portainer http://portainer:9000;
            proxy_pass $portainer/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /portainer;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Rewrite absolute-path redirects from Portainer to include /portainer/ prefix
            # e.g. "Location: /timeout.html" → "Location: /portainer/timeout.html"
            proxy_redirect ~^/(?!portainer/)(.*)$ /portainer/$1;

            # WebSocket support (Portainer dùng WS cho realtime logs)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /ai/ {
            set $ai_upstream http://ai-service:8001;
            proxy_pass $ai_upstream/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            set $frontend http://erp_frontend:80;
            proxy_pass $frontend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
