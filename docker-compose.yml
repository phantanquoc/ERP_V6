services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-erp_database}
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "fsync=on"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "max_connections=350"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # ports:
    #   - "5432:5432"
    # Security: PostgreSQL should only be accessible within the Docker network, not exposed to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password_change_me}@postgres:5432/${POSTGRES_DB:-erp_database}?schema=public&connection_limit=30
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_me}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_refresh_key_change_me}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://anbinhfoods.net,https://www.anbinhfoods.net}
      API_URL: ${API_URL:-https://anbinhfoods.net/api}
      LOG_LEVEL: warn
      FACE_DATA_SECRET: ${FACE_DATA_SECRET:-change_me_face_data_secret}
      AI_SERVICE_URL: http://erp_ai:8001
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@anbinhfoods.net}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://anbinhfoods.net/api}
        VITE_FACE_DEVICE_KEY: ${VITE_FACE_DEVICE_KEY:-}
        VITE_FACE_DEVICE_ID: ${VITE_FACE_DEVICE_ID:-}
    container_name: erp_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://anbinhfoods.net/api}
      VITE_FACE_DEVICE_KEY: ${VITE_FACE_DEVICE_KEY:-}
      VITE_FACE_DEVICE_ID: ${VITE_FACE_DEVICE_ID:-}
    depends_on:
      - backend
    networks:
      - erp_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - erp_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # AI Service — Face Recognition + RAG Chatbot
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: erp_ai
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_GRADER_MODEL: ${GROQ_GRADER_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - ./docs/chatbot:/app/docs/chatbot:ro
      - ai_chroma_data:/app/chroma_data
      - deepface_weights:/root/.deepface/weights
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local
  ai_chroma_data:
    driver: local
  deepface_weights:
    driver: local

networks:
  erp_network:
    driver: bridge
