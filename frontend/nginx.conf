server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Fix MIME type for ES module workers (.mjs) — pdfjs-dist uses .mjs
    # Include default mime.types at server level then add mjs, otherwise
    # `types { ... }` would override and lose application/pdf etc.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle React Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets KHÔNG BAO GIỜ fallback về index.html: trình duyệt sẽ
    # nhận text/html cho module script và chặn theo strict MIME check
    # ("Failed to load module script ... MIME type of text/html") mỗi lần
    # deploy đổi hash chunk. Trả 404 thật để client phát hiện chunk cũ và tự reload.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 404 không còn trả error page text/html mặc định của nginx — mọi request
    # không khớp file (kể cả route SPA gõ tay) đều về index.html.
    error_page 404 /index.html;

    # Cache static assets
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Đừng cache HTML (không dùng expires -1 — nó sinh header Cache-Control
    # thứ hai "no-cache" chồng lên dòng add_header bên dưới)
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Service worker phải luôn revalidate để nhận bản mới sau mỗi deploy
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}

