server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Fix MIME type for ES module workers (.mjs) — pdfjs-dist uses .mjs
    # Include default mime.types at server level then add mjs, otherwise
    # `types { ... }` would override and lose application/pdf etc.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hashed assets KHÔNG BAO GIỜ fallback về index.html: sau mỗi deploy các
    # chunk hash cũ không còn tồn tại; nếu trả index.html (text/html) cho
    # module script thì browser chặn theo strict MIME check
    # ("Failed to load module script ... MIME type of text/html"). ^~ để
    # thắng regex \.(js|...) bên dưới; try_files =404 trả 404 thật để
    # client phát hiện chunk cũ và tự reload (main.tsx).
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker phải luôn revalidate để nhận bản mới sau mỗi deploy
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Các file public KHÔNG có hash (favicon, logo của notification):
    # KHÔNG ĐƯỢC immutable — đổi file cùng URL sẽ không bao giờ tới tay
    # user. no-cache để browser revalidate mỗi lần (304 nếu không đổi).
    location = /favicon.ico {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.png {
        add_header Cache-Control "no-cache";
    }

    location = /logo.png {
        add_header Cache-Control "no-cache";
    }

    location = /abf-logo.png {
        add_header Cache-Control "no-cache";
    }

    location = /koola-logo.png {
        add_header Cache-Control "no-cache";
    }

    # Đừng cache HTML — bỏ expires -1 vì nó tự thêm header Cache-Control
    # thứ hai "no-cache" chồng lên dòng add_header bên dưới
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets còn lại (ngoài /assets/ đã xử lý ở trên).
    # CHÚ Ý: KHÔNG có png/jpg/jpeg/gif/ico ở đây — ảnh không hash trong
    # public/ mà immutable thì đổi file cùng URL không bao giờ tới tay
    # user (bug logo cũ trên tablet 09/2026). Ảnh chỉ được cache heuristic
    # theo Last-Modified, hoặc no-cache qua location = riêng ở trên.
    location ~* \.(js|mjs|css|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sơ đồ nhà máy (PDF gốc là nguồn của FactoryOverview): no-cache để
    # đổi bản vẽ là user nhận ngay, không nằm trong cache heuristic 1 năm
    location ^~ /factory/ {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — mọi route gõ tay đều về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
