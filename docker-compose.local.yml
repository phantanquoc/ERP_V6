services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password_change_me}@postgres:5432/${POSTGRES_DB:-erp_database}?schema=public&connection_limit=30
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_me}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_refresh_key_change_me}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
      API_URL: ${API_URL:-http://localhost:5001/api}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "5001:5000"

  frontend:
    build:
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
    ports:
      - "8080:80"

  nginx:
    profiles:
      - local-disabled

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password_change_me}@postgres:5432/${POSTGRES_DB:-erp_database}?schema=public&connection_limit=30
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_refresh_key_change_me}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run prisma:seed"
    networks:
      - erp_network
    profiles:
      - local-tools
