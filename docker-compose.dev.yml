# Docker Compose - Development (localhost, no nginx)
# Chạy: docker compose -f docker-compose.dev.yml up --build
# Dừng:  docker compose -f docker-compose.dev.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: erp_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_dev_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: erp_dev_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://erp_user:erp_dev_password@postgres:5432/erp_database?schema=public
      JWT_SECRET: dev_jwt_secret_key_localhost
      JWT_EXPIRE: 7d
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_localhost
      JWT_REFRESH_EXPIRE: 30d
      CORS_ORIGIN: http://localhost:5173
      API_URL: http://localhost:5003
      LOG_LEVEL: debug
      AI_SERVICE_URL: http://ai-service:8001
      FACE_DATA_SECRET: dev_face_data_secret_key_localhost
    ports:
      - "5003:5000"
    volumes:
      - backend_uploads_dev:/app/uploads
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp_dev_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: erp_dev_ai
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat-v3-0324}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8001:8001"
    volumes:
      - deepface_weights:/root/.deepface/weights
      - ./docs/chatbot:/app/docs/chatbot:ro
      - ai_chroma_dev:/app/chroma_data
      - ./ai-service/main.py:/app/main.py:ro
      - ./ai-service/app.py:/app/app.py:ro
      - ./ai-service/config.py:/app/config.py:ro
      - ./ai-service/face:/app/face:ro
      - ./ai-service/chat:/app/chat:ro
      - ./ai-service/agent:/app/agent:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - erp_dev_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: erp_dev_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5003/api
      VITE_FACE_DEVICE_KEY: ${VITE_FACE_DEVICE_KEY:-}
      VITE_FACE_DEVICE_ID: ${VITE_FACE_DEVICE_ID:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      - backend
    networks:
      - erp_dev_network

volumes:
  postgres_dev_data:
    driver: local
  backend_uploads_dev:
    driver: local
  deepface_weights:
    driver: local  # persist ArcFace/FaceNet weights across rebuilds
  ai_chroma_dev:
    driver: local

networks:
  erp_dev_network:
    driver: bridge
